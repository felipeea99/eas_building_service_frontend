<div class="confirm-modal">
  <div class="confirm-head">
    <div class="confirm-icon" [class.destructive]="isDestructive">
      @if (isDestructive) {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      }
    </div>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
  </div>

  @if (showTextarea) {
    <div class="confirm-textarea-wrapper">
      <textarea
        class="confirm-textarea"
        [placeholder]="placeholder"
        [value]="reasonText()"
        (input)="reasonText.set($any($event.target).value)"
        rows="3"
      ></textarea>
      @if (textRequired && !reasonText().trim()) {
        <span class="textarea-hint">Este campo es requerido</span>
      }
    </div>
  }

  <div class="confirm-actions">
    <button type="button" class="confirm-btn-cancel" (click)="onCancel()">
      {{ cancelLabel }}
    </button>
    <button
      type="button"
      class="confirm-btn-submit"
      [class.destructive]="isDestructive"
      [class.loading]="isSubmitting()"
      [disabled]="!canConfirm || isSubmitting()"
      (click)="onConfirm()"
    >
      <span class="btn-label">{{ confirmLabel }}</span>
      <span class="btn-spinner"></span>
    </button>
  </div>
</div>

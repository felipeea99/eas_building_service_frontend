@if (wizard.isOpen()) {
  <!-- Backdrop -->
  <div class="wizard-backdrop" [class.wizard-leaving]="wizard.leaving()"></div>

  <!-- Wizard -->
  <div class="wizard-container" [class.wizard-leaving]="wizard.leaving()">
    <div class="wizard-panel">
      <!-- Botón cerrar (X) -->
      <button class="wizard-close" (click)="onClose()" [disabled]="busy()" aria-label="Cerrar wizard">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- Stepper -->
      <div class="wizard-stepper">
        @for (step of wizard.steps(); track $index) {
          <div class="stepper-item"
            [class.completed]="$index < wizard.currentIndex()"
            [class.active]="$index === wizard.currentIndex()"
            [class.pending]="$index > wizard.currentIndex()">
            <div class="stepper-circle">
              @if ($index < wizard.currentIndex()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              } @else {
                {{ $index + 1 }}
              }
            </div>
            <div class="stepper-label">
              <span class="stepper-title">{{ step.title }}</span>
              @if (step.description) {
                <span class="stepper-description">{{ step.description }}</span>
              }
            </div>
          </div>
          @if ($index < wizard.steps().length - 1) {
            <div class="stepper-line"
              [class.completed]="$index < wizard.currentIndex()">
            </div>
          }
        }
      </div>

      <!-- Contenido del paso actual -->
      <div class="wizard-body">
        <ng-content />
      </div>

      <!-- Barra de botones -->
      <div class="wizard-footer">
        <button
          class="wizard-btn wizard-btn-secondary"
          (click)="onPrevious()"
          [disabled]="busy()"
          [class.hidden]="wizard.isFirst()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Anterior
        </button>

        <div class="wizard-spacer"></div>

        <button
          class="wizard-btn wizard-btn-primary"
          (click)="onNext()"
          [disabled]="!wizard.stepValid() || busy()">
          {{ wizard.isLast() ? (busy() ? 'Guardando...' : finishLabel()) : 'Siguiente' }}
          @if (!wizard.isLast()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          }
        </button>
      </div>
    </div>
  </div>
}

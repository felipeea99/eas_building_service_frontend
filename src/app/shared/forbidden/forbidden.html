<div class="forbidden-page">
  <div class="forbidden-card">
    <!-- Ilustración: escudo con candado -->
    <div class="forbidden-illustration">
      <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <rect x="9" y="10" width="6" height="5" rx="1"/>
        <path d="M10 10V8a2 2 0 1 1 4 0v2"/>
      </svg>
    </div>

    <h1>Acceso restringido</h1>
    <p class="forbidden-code">Error 403</p>
    <p class="forbidden-description">
      No tienes permisos para acceder a esta sección.
      Contacta a tu administrador si crees que es un error.
    </p>

    <button class="submit-btn forbidden-btn" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      <span>Volver al inicio</span>
    </button>
  </div>
</div>

<div class="edit-reservable-space">
  <div class="form-head">
    <div class="head-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
        <path d="m15 5 4 4"/>
      </svg>
    </div>
    <div class="head-text">
      <h2>Editar espacio reservable</h2>
      <p>Modifica los datos del espacio</p>
    </div>
  </div>

  <hr class="form-divider">

  @if (serverError()) {
    <div class="server-error">{{ serverError() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Imagen del espacio -->
    <div class="form-fields">
      <div class="form-group full-width">
        <label>Imagen del espacio</label>
        <div class="image-upload-area">
          @if (imagePreview() || currentImageUrl()) {
            <div class="image-preview-wrapper">
              <img [src]="imagePreview() || currentImageUrl()" alt="Imagen del espacio" class="image-preview">
              <button type="button" class="remove-image-btn" (click)="removeImage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
              <label class="change-image-btn" for="edit-space-imageS3">Cambiar</label>
            </div>
          } @else {
            <label class="upload-placeholder" for="edit-space-imageS3">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>Seleccionar imagen</span>
              <span class="upload-hint">JPG, PNG o WebP</span>
            </label>
          }
          <input type="file" id="edit-space-imageS3" accept="image/*" (change)="onFileSelected($event)" hidden>
        </div>
      </div>
    </div>

    <div class="form-fields">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" formControlName="name" placeholder="Ej: Sala A" />
      </div>
      <div class="form-group">
        <label>Tipo de espacio</label>
        <select formControlName="type">
          @for (t of spaceTypes; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-fields">
      <div class="form-group">
        <label>Capacidad</label>
        <input type="number" formControlName="capacity" placeholder="Ej: 10" min="1" />
      </div>
      <div class="form-group">
        <label>Requiere aprobación</label>
        <select formControlName="requiresApproval">
          <option [value]="false">No</option>
          <option [value]="true">Sí</option>
        </select>
      </div>
    </div>

    <div class="form-fields">
      <div class="form-group">
        <label>Tiene costo</label>
        <select formControlName="hasCost">
          <option [value]="false">No</option>
          <option [value]="true">Sí</option>
        </select>
      </div>

      @if (hasCost) {
        <div class="form-group">
          <label>Tarifa</label>
          <input type="number" formControlName="rate" placeholder="0.00" min="0" step="0.01" />
        </div>
      }
    </div>

    @if (hasCost) {
      <div class="form-fields">
        <div class="form-group">
          <label>Tipo de tarifa</label>
          <select formControlName="reservationRateType">
            @for (rt of rateTypes; track rt.value) {
              <option [value]="rt.value">{{ rt.label }}</option>
            }
          </select>
        </div>
      </div>
    }

    <div class="form-actions">
      <button type="submit" class="submit-btn" [disabled]="isSubmitting()" [class.loading]="isSubmitting()">
        <span class="btn-label">Guardar cambios</span>
        <span class="btn-spinner"></span>
      </button>
    </div>
  </form>
</div>

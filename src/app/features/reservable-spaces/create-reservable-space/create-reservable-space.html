<div class="create-reservable-space">
  <div class="form-head">
    <div class="head-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <div class="head-text">
      <h2>Nuevo espacio reservable</h2>
      <p>Registra un nuevo espacio para reservaciones</p>
    </div>
  </div>

  <hr class="form-divider">

  <!-- Imagen del espacio -->
  <div class="form-fields">
    <div class="form-group full-width">
      <label>Imagen del espacio</label>
      <div class="image-upload-area">
        @if (imagePreview()) {
          <div class="image-preview-wrapper">
            <img [src]="imagePreview()" alt="Vista previa" class="image-preview">
            <button type="button" class="remove-image-btn" (click)="removeImage()">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        } @else {
          <label class="upload-placeholder" for="create-space-imageS3">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span>Seleccionar imagen</span>
            <span class="upload-hint">JPG, PNG o WebP</span>
          </label>
        }
        <input type="file" id="create-space-imageS3" accept="image/*" (change)="onFileSelected($event)" hidden>
      </div>
    </div>
  </div>

  <div class="form-fields">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" placeholder="Ej: Sala A" [value]="name()" (input)="name.set(asInputValue($event))" />
    </div>
    <div class="form-group">
      <label>Tipo de espacio</label>
      <select [value]="type()" (change)="type.set(+asInputValue($event))">
        <option value="" disabled [selected]="type() === null">-- Selecciona un tipo --</option>
        @for (t of spaceTypes; track t.value) {
          <option [value]="t.value">{{ t.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-fields">
    <div class="form-group">
      <label>Capacidad</label>
      <input type="number" placeholder="Ej: 10" min="1" [value]="capacity()" (input)="capacity.set(+asInputValue($event))" />
    </div>
    <div class="form-group">
      <label>Requiere aprobación</label>
      <select (change)="requiresApproval.set(asInputValue($event) === 'true')">
        <option value="" disabled selected>-- Selecciona --</option>
        <option value="false">No</option>
        <option value="true">Sí</option>
      </select>
    </div>
  </div>

  <div class="form-fields">
    <div class="form-group">
      <label>Tiene costo</label>
      <select (change)="hasCost.set(asInputValue($event) === 'true')">
        <option value="" disabled selected>-- Selecciona --</option>
        <option value="false">No</option>
        <option value="true">Sí</option>
      </select>
    </div>

    @if (hasCost()) {
      <div class="form-group">
        <label>Tarifa</label>
        <input type="number" placeholder="0.00" min="0" step="0.01" [value]="rate()" (input)="rate.set(+asInputValue($event))" />
      </div>
    }
  </div>

  @if (hasCost()) {
    <div class="form-fields">
      <div class="form-group">
        <label>Tipo de tarifa</label>
        <select (change)="reservationRateType.set(+asInputValue($event))">
          <option value="" disabled selected>-- Selecciona tipo de tarifa --</option>
          @for (rt of rateTypes; track rt.value) {
            <option [value]="rt.value">{{ rt.label }}</option>
          }
        </select>
      </div>
    </div>
  }

  <div class="form-actions">
    <button class="submit-btn" [disabled]="isCreating()" (click)="onSubmit()">
      <span class="btn-label">Crear espacio</span>
      <span class="btn-spinner"></span>
    </button>
  </div>
</div>

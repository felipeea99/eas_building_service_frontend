@switch(this.role) {
  @case("SuperAdmin") {
    <app-inicio-admin />
  }
  @case("Support") {
    <app-inicio-admin />
  }
  @case("Admin") {
    <app-inicio-admin />
  }
  @case("Manager") {
    <app-inicio-admin />
  }
  @case ("Staff") {
    <app-inicio-admin/>
  }
  <!-- Client y Guard: tarjetas de sus edificios (si tienen 1, el login los manda directo al dashboard) -->
  @case("Client") {
    <app-inicio-buildings />
  }
  @case ("Guard") {
    <app-inicio-buildings />
  }
}
